name: ClipFlow
configs:
  Debug: debug
  Performance: release
  Release: release
options:
  bundleIdPrefix: com.clipflow
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  ClipFlow:
    type: application
    platform: macOS
    sources:
      - path: ClipFlow
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipflow.v12
        PRODUCT_NAME: ClipFlow
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 200
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: ClipFlow/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_ALLOWED: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Performance:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

  ClipFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipFlowTests
    dependencies:
      - target: ClipFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipflow.v12.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Performance:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
  ClipFlowUITests:

    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ClipFlowUITests
    dependencies:
      - target: ClipFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipflow.v12.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: ClipFlow
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Performance:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"

schemes:
  ClipFlow:
    build:
      targets:
        ClipFlow: all
        ClipFlowTests: [test]
        ClipFlowUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: ClipFlowTests
        - name: ClipFlowUITests
